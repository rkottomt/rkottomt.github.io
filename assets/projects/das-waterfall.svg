<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="DAS waterfall diagram: channel index versus time with stationary noise bands and a diagonal vehicle streak">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="vehicle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b4a"/>
      <stop offset="100%" stop-color="#ffb347"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" fill="url(#bg)" rx="12"/>
  <rect x="72" y="48" width="600" height="300" fill="#0a0e14" stroke="#30363d" stroke-width="1.5" rx="4"/>
  <g opacity="0.35">
    <rect x="72" y="118" width="600" height="18" fill="#3d5a80"/>
    <rect x="72" y="198" width="600" height="14" fill="#3d5a80"/>
    <rect x="72" y="278" width="600" height="20" fill="#3d5a80"/>
  </g>
  <text x="372" y="88" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">stationary noise (horizontal bands)</text>
  <line x1="140" y1="318" x2="580" y2="108" stroke="url(#vehicle)" stroke-width="6" stroke-linecap="round"/>
  <line x1="140" y1="318" x2="580" y2="108" stroke="#ffb347" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <text x="500" y="130" fill="#ffb347" font-family="monospace" font-size="11">vehicle streak</text>
  <text x="500" y="146" fill="#8b949e" font-family="monospace" font-size="10">slope = apparent speed</text>
  <line x1="72" y1="348" x2="672" y2="348" stroke="#484f58" stroke-width="1"/>
  <line x1="72" y1="348" x2="72" y2="48" stroke="#484f58" stroke-width="1"/>
  <text x="372" y="378" fill="#c9d1d9" font-family="monospace" font-size="12" text-anchor="middle">time ’</text>
  <text x="36" y="198" fill="#c9d1d9" font-family="monospace" font-size="12" text-anchor="middle" transform="rotate(-90 36 198)">channel ’</text>
  <text x="372" y="24" fill="#e6edf3" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Strain-rate waterfall</text>
</svg>
